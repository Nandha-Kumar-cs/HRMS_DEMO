<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — HRMS</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #0f172a; color: #fff; display: flex; align-items: center;
               justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
        .box { padding: 40px 32px; }
        .icon { font-size: 56px; margin-bottom: 20px; }
        h2 { font-size: 22px; margin: 0 0 10px; }
        p  { color: #94a3b8; font-size: 14px; margin: 0 0 24px; }
        button { background: #1e3a8a; border: none; color: #fff; padding: 10px 24px;
                 border-radius: 6px; font-size: 14px; cursor: pointer; }
        button:hover { background: #1e40af; }
    </style>
</head>
<body>
<div class="box">
    <div class="icon">📡</div>
    <h2>You're offline</h2>
    <p>HRMS requires an internet connection.<br>Please check your network and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
</div>
</body>
</html>
